<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Подключаем FontAwesome для иконок -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
            min-height: 100vh;
            color: #222;
        }

        .container {
            width: 1100px;
            max-width: 95%;
            margin: 40px auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 34px;
        }

        header p {
            opacity: .8;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .15);
        }

        form {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 15px;
        }

        textarea {
            grid-column: 1/3;
            resize: vertical;
        }

        input,
        textarea {
            border: none;
            background: #f2f5fa;
            border-radius: 12px;
            padding: 14px;
            font-size: 15px;
        }

        input:focus,
        textarea:focus {
            outline: 2px solid #4f46e5;
        }

        button {
            border: none;
            cursor: pointer;
            border-radius: 12px;
            padding: 14px 22px;
            font-weight: 600;
            transition: .2s;
        }

        .btn-primary {
            background: #4f46e5;
            color: white;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
        }

        .stats {
            display: flex;
            gap: 20px;
            margin: 25px 0;
        }

        .stat {
            flex: 1;
            background: white;
            border-radius: 18px;
            padding: 18px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .08);
        }

        .stat h2 {
            color: #4f46e5;
            font-size: 30px;
        }

        #habits {
            display: grid;
            gap: 18px;
        }

        .habit {
            background: white;
            border-radius: 18px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .08);
            transition: all 0.3s ease;
        }

        .left {
            flex: 1;
        }

        .left h3 {
            margin-bottom: 6px;
        }

        .desc {
            color: #666;
            margin-bottom: 8px;
        }

        .date {
            font-size: 13px;
            color: #999;
        }

        .actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .icon-btn {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            font-size: 16px;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .icon-btn:hover {
            opacity: 0.9;
        }

        .edit { background: #0ea5e9; }
        .delete { background: #ef4444; }

        .check-done { background: #10b981; }
        .check-notdone { background: #cbd5e1; color: #64748b; }

        .done {
            border-left: 8px solid #10b981;
        }

        .notdone {
            border-left: 8px solid #ef4444;
        }

        .empty {
            background: white;
            text-align: center;
            padding: 60px;
            border-radius: 18px;
            color: #666;
        }

        .empty i {
            font-size: 48px;
            color: #a1a1aa;
            margin-bottom: 15px;
        }

        footer {
            text-align: center;
            margin-top: 25px;
            color: white;
            opacity: .8;
        }

        @media (max-width: 800px) {
            form {
                grid-template-columns: 1fr;
            }
            textarea {
                grid-column: auto;
            }
            .habit {
                flex-direction: column;
                align-items: flex-start;
                gap: 20px;
            }
            .actions {
                width: 100%;
                justify-content: flex-end;
            }
            .stats {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <header>
            <div>
                <h1><i class="fa-solid fa-leaf" style="color: #10b981; margin-right: 8px;"></i> Habit Tracker</h1>
                <p>Базовый трекер привычек</p>
            </div>
        </header>

        <div class="card">

            <form id="habitForm">

                <input id="name" placeholder="Название привычки" required>

                <input id="description" placeholder="Краткое описание">

                <textarea id="description2" rows="3" placeholder="Подробное описание (необязательно)" style="display:none"></textarea>

                <button class="btn-primary" type="submit">
                    <i class="fa-solid fa-plus"></i> <span id="submit-text">Добавить</span>
                </button>

            </form>

        </div>

        <div class="stats">

            <div class="stat">
                <h2 id="total">0</h2>
                <div>Всего</div>
            </div>

            <div class="stat">
                <h2 id="completed">0</h2>
                <div>Выполнено</div>
            </div>

            <div class="stat">
                <h2 id="active">0</h2>
                <div>Осталось</div>
            </div>

        </div>

        <div id="habits"></div>

        <footer>
            Habit Tracker • localhost:8000
        </footer>

    </div>

    <script>
        const API = "http://localhost:8000/habits";

        let editId = null;

        async function loadHabits() {
            try {
                const res = await fetch(API);
                const habits = await res.json();
                render(habits);
            } catch (error) {
                console.error("Ошибка загрузки:", error);
            }
        }

        function render(habits) {
            const container = document.getElementById("habits");
            container.innerHTML = "";

            document.getElementById("total").innerText = habits.length;

            const completed = habits.filter(h => h.checking).length;
            document.getElementById("completed").innerText = completed;
            document.getElementById("active").innerText = habits.length - completed;

            if (habits.length === 0) {
                container.innerHTML = `
                <div class="empty">
                    <i class="fa-solid fa-seedling"></i>
                    <h2>Пока нет привычек</h2>
                    <p>Добавьте первую привычку выше</p>
                </div>`;
                return;
            }

            habits.forEach(h => {
                const div = document.createElement("div");
                div.className = "habit " + (h.checking ? "done" : "notdone");

                div.innerHTML = `
                <div class="left">
                    <h3 style="${h.checking ? 'text-decoration: line-through; color: #9ca3af;' : ''}">${h.name}</h3>
                    <div class="desc" style="${h.checking ? 'text-decoration: line-through; color: #9ca3af;' : ''}">
                        ${h.description || ""}
                    </div>
                    <div class="date">
                        <i class="fa-regular fa-calendar" style="margin-right: 4px;"></i> Создано: ${h.date_created_habit || "-"}
                    </div>
                </div>

                <div class="actions">
                    <button class="icon-btn ${h.checking ? 'check-done' : 'check-notdone'}" onclick="toggleHabit(${h.id})" title="Отметить">
                        ${h.checking ? '<i class="fa-solid fa-check"></i>' : '<i class="fa-solid fa-minus"></i>'}
                    </button>

                    <button class="icon-btn edit" onclick="editHabit(${h.id})" title="Редактировать">
                        <i class="fa-solid fa-pen-to-square"></i>
                    </button>

                    <button class="icon-btn delete" onclick="deleteHabit(${h.id})" title="Удалить">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </div>`;

                container.appendChild(div);
            });
        }

        document.getElementById("habitForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const name = document.getElementById("name").value;
            const description = document.getElementById("description").value;

            const body = {
                name,
                description,
                checking: false // при добавлении всегда false
            };

            try {
                if (editId === null) {
                    await fetch(API, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(body)
                    });
                } else {
                    await fetch(API + "/" + editId, {
                        method: "PUT",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(body)
                    });

                    editId = null;
                    document.getElementById("submit-text").innerText = "Добавить";
                    document.querySelector(".btn-primary i").className = "fa-solid fa-plus";
                }

                e.target.reset();
                loadHabits();
            } catch (error) {
                console.error("Ошибка сохранения:", error);
            }
        });

        async function deleteHabit(id) {
            if (!confirm("Удалить привычку?")) return;
            try {
                await fetch(API + "/" + id, { method: "DELETE" });
                loadHabits();
            } catch (error) {
                console.error("Ошибка удаления:", error);
            }
        }

        async function editHabit(id) {
            try {
                const res = await fetch(API + "/" + id);
                const h = await res.json();

                document.getElementById("name").value = h.name;
                document.getElementById("description").value = h.description;

                editId = id;
                document.getElementById("submit-text").innerText = "Сохранить";
                document.querySelector(".btn-primary i").className = "fa-solid fa-pen";

                window.scrollTo({ top: 0, behavior: "smooth" });
            } catch (error) {
                console.error("Ошибка при получении данных для редактирования:", error);
            }
        }

        async function toggleHabit(id) {
            try {
                // Вызываем новый эндпойнт для переключения статуса
                // Убедитесь, что на сервере (в FastAPI) добавлен роут: PATCH /habits/{habit_id}/toggle
                await fetch(API + "/" + id + "/toggle", {
                    method: "PATCH"
                });

                loadHabits();
            } catch (error) {
                console.error("Ошибка изменения статуса:", error);
            }
        }

        loadHabits();
    </script>
</body>

</html>
