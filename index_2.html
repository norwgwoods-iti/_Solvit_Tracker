<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Подключаем FontAwesome для иконок -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
            min-height: 100vh;
            color: #222;
        }

        .container {
            width: 1100px;
            max-width: 95%;
            margin: 40px auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 34px;
        }

        header p {
            opacity: .8;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .15);
        }

        form {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 15px;
        }

        input,
        textarea {
            border: none;
            background: #f2f5fa;
            border-radius: 12px;
            padding: 14px;
            font-size: 15px;
            width: 100%; /* Чтобы input занимали всю ширину ячейки грида */
        }

        input:focus,
        textarea:focus {
            outline: 2px solid #4f46e5;
        }

        button {
            border: none;
            cursor: pointer;
            border-radius: 12px;
            padding: 14px 22px;
            font-weight: 600;
            transition: .2s;
        }

        .btn-primary {
            background: #4f46e5;
            color: white;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #cbd5e1;
            color: #1e293b;
        }
        .btn-secondary:hover {
            background: #b4c6ef;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin: 25px 0;
        }

        .stat {
            flex: 1;
            background: white;
            border-radius: 18px;
            padding: 18px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .08);
        }

        .stat h2 {
            color: #4f46e5;
            font-size: 30px;
        }

        #habits {
            display: grid;
            gap: 18px;
        }

        .habit {
            background: white;
            border-radius: 18px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .08);
            transition: all 0.3s ease;
        }

        .left {
            flex: 1;
        }

        .left h3 {
            margin-bottom: 6px;
        }

        .desc {
            color: #666;
            margin-bottom: 8px;
        }

        .date {
            font-size: 13px;
            color: #999;
        }

        .actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .icon-btn {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            font-size: 16px;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .icon-btn:hover {
            opacity: 0.9;
        }

        .edit { background: #0ea5e9; }
        .delete { background: #ef4444; }

        .check-done { background: #10b981; }
        .check-notdone { background: #cbd5e1; color: #64748b; }

        .done {
            border-left: 8px solid #10b981;
        }

        .notdone {
            border-left: 8px solid #ef4444;
        }

        .empty {
            background: white;
            text-align: center;
            padding: 60px;
            border-radius: 18px;
            color: #666;
        }

        .empty i {
            font-size: 48px;
            color: #a1a1aa;
            margin-bottom: 15px;
        }

        footer {
            text-align: center;
            margin-top: 25px;
            color: white;
            opacity: .8;
        }

        /* --- Стили для Модального Окна (Редактирования) --- */
        .modal {
            display: none; /* Скрыто по умолчанию */
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.5); /* Затемнение фона */
            align-items: center; /* Центрирование по вертикали (flex) */
            justify-content: center; /* Центрирование по горизонтали (flex) */
        }

        .modal-content {
            background-color: #fefefe;
            padding: 30px;
            border-radius: 18px;
            width: 600px; /* Фиксированная ширина окна */
            max-width: 90%; /* Адаптивность */
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            position: relative; /* Для позиционирования крестика закрытия */
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            font-size: 24px;
            color: #4f46e5;
        }

        .close-modal {
            color: #aaa;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
        }

        .close-modal:hover {
            color: #ef4444;
        }

        /* Форма внутри модального окна - 1 колонка */
        #editForm {
            grid-template-columns: 1fr;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 20px;
        }


        @media (max-width: 800px) {
            form {
                grid-template-columns: 1fr;
            }
            .habit {
                flex-direction: column;
                align-items: flex-start;
                gap: 20px;
            }
            .actions {
                width: 100%;
                justify-content: flex-end;
            }
            .stats {
                flex-direction: column;
            }
            .modal-content {
                width: 95%; /* Почти на весь экран на мобильных */
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <header>
            <div>
                <h1><i class="fa-solid fa-leaf" style="color: #10b981; margin-right: 8px;"></i> Habit Tracker</h1>
                <p>Базовый трекер привычек</p>
            </div>
        </header>

        <!-- Карта с формой ДОБАВЛЕНИЯ (POST) -->
        <div class="card" style="margin-bottom: 25px;">
            <form id="addHabitForm">
                <input id="addName" placeholder="Название привычки" required>
                <input id="addDescription" placeholder="Краткое описание">

                <button class="btn-primary" type="submit">
                    <i class="fa-solid fa-plus"></i> Добавить
                </button>
            </form>
        </div>

        <div class="stats">
            <div class="stat">
                <h2 id="total">0</h2>
                <div>Всего</div>
            </div>

            <div class="stat">
                <h2 id="completed">0</h2>
                <div>Выполнено</div>
            </div>

            <div class="stat">
                <h2 id="active">0</h2>
                <div>Осталось</div>
            </div>
        </div>

        <div id="habits"></div>

        <footer>
            Habit Tracker • localhost:8000
        </footer>

    </div>


    <!-- --- МОДАЛЬНОЕ ОКНО РЕДАКТИРОВАНИЯ (Скрыто по умолчанию) --- -->
    <div id="editModal" class="modal">
        <div class="modal-content">

            <div class="modal-header">
                <h2>Редактировать привычку</h2>
                <button class="close-modal" onclick="closeModal()">&times;</button>
            </div>

            <form id="editForm">
                <!-- Скрытое поле для ID, чтобы знать, что обновлять -->
                <input type="hidden" id="editHabitId">
                <!-- Поле, чтобы хранить текущий статус checking -->
                <input type="hidden" id="editHabitChecking">

                <input id="editName" placeholder="Название привычки" required>
                <textarea id="editDescription" placeholder="Краткое описание" rows="2" style="resize: vertical;"></textarea>

                <div class="modal-actions">
                    <button type="button" class="btn-secondary" onclick="closeModal()">Отмена</button>
                    <button class="btn-primary" type="submit">
                        <i class="fa-solid fa-save"></i> Сохранить
                    </button>
                </div>
            </form>

        </div>
    </div>


    <script>
        const API = "http://localhost:8000/habits";

        // --- Управление Модальным Окном ---
        function openModal() {
            document.getElementById("editModal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("editModal").style.display = "none";
            document.getElementById("editForm").reset(); // Очистить поля
        }

        // Закрытие окна при клике вне его области (на затемнение)
        window.onclick = function(event) {
            const modal = document.getElementById("editModal");
            if (event.target == modal) {
                closeModal();
            }
        }


        // --- Основная Логика ---

        async function loadHabits() {
            try {
                const res = await fetch(API);
                const habits = await res.json();
                render(habits);
            } catch (error) {
                console.error("Ошибка загрузки:", error);
            }
        }

        function render(habits) {
            const container = document.getElementById("habits");
            container.innerHTML = "";

            document.getElementById("total").innerText = habits.length;

            const completed = habits.filter(h => h.checking).length;
            document.getElementById("completed").innerText = completed;
            document.getElementById("active").innerText = habits.length - completed;

            if (habits.length === 0) {
                container.innerHTML = `
                <div class="empty">
                    <i class="fa-solid fa-seedling"></i>
                    <h2>Пока нет привычек</h2>
                    <p>Добавьте первую привычку выше</p>
                </div>`;
                return;
            }

            habits.forEach(h => {
                const div = document.createElement("div");
                div.className = "habit " + (h.checking ? "done" : "notdone");

                div.innerHTML = `
                <div class="left">
                    <h3 style="${h.checking ? 'text-decoration: line-through; color: #9ca3af;' : ''}">${h.name}</h3>
                    <div class="desc" style="${h.checking ? 'text-decoration: line-through; color: #9ca3af;' : ''}">
                        ${h.description || ""}
                    </div>
                    <div class="date">
                        <i class="fa-regular fa-calendar" style="margin-right: 4px;"></i> Создано: ${h.date_created_habit || "-"}
                    </div>
                </div>

                <div class="actions">
                    <button class="icon-btn ${h.checking ? 'check-done' : 'check-notdone'}" onclick="toggleHabit(${h.id})" title="Отметить">
                        ${h.checking ? '<i class="fa-solid fa-check"></i>' : '<i class="fa-solid fa-minus"></i>'}
                    </button>

                    <!-- Вызывает openModal() в editHabit() -->
                    <button class="icon-btn edit" onclick="editHabit(${h.id})" title="Редактировать">
                        <i class="fa-solid fa-pen-to-square"></i>
                    </button>

                    <button class="icon-btn delete" onclick="deleteHabit(${h.id})" title="Удалить">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </div>`;

                container.appendChild(div);
            });
        }


        // --- ОБРАБОТЧИК: ДОБАВЛЕНИЕ ПРИВЫЧКИ (Main Card Form) ---
        document.getElementById("addHabitForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const body = {
                name: document.getElementById("addName").value,
                description: document.getElementById("addDescription").value,
                checking: false // при добавлении всегда false
            };

            try {
                await fetch(API, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(body)
                });

                e.target.reset();
                loadHabits();
            } catch (error) {
                console.error("Ошибка добавления:", error);
            }
        });


        // --- ОБРАБОТЧИК: СОХРАНЕНИЕ ИЗМЕНЕНИЙ (Modal Form) ---
        document.getElementById("editForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const id = document.getElementById("editHabitId").value;
            // Важно: принудительно переводим строку в boolean
            const currentChecking = (document.getElementById("editHabitChecking").value === 'true');

            const body = {
                name: document.getElementById("editName").value,
                description: document.getElementById("editDescription").value,
                // Сохраняем ТЕКУЩИЙ статус выполнения, чтобы не сбрасывать его при PUT-запросе
                checking: currentChecking
            };

            try {
                // PUT /habits/{id}
                await fetch(API + "/" + id, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(body)
                });

                closeModal(); // Закрыть окно
                loadHabits(); // Обновить список
            } catch (error) {
                console.error("Ошибка сохранения изменений:", error);
            }
        });



        async function deleteHabit(id) {
            if (!confirm("Удалить привычку?")) return;
            try {
                await fetch(API + "/" + id, { method: "DELETE" });
                loadHabits();
            } catch (error) {
                console.error("Ошибка удаления:", error);
            }
        }

        // ПОЛУЧЕНИЕ ДАННЫХ И ОТКРЫТИЕ МОДАЛЬНОГО ОКНА
        async function editHabit(id) {
            try {
                const res = await fetch(API + "/" + id);
                const h = await res.json();

                // Заполняем СКРЫТЫЕ поля в модалке
                document.getElementById("editHabitId").value = h.id;
                document.getElementById("editHabitChecking").value = h.checking; // Храним текущий статус

                // Заполняем ВИДИМЫЕ поля в модалке
                document.getElementById("editName").value = h.name;
                document.getElementById("editDescription").value = h.description;

                openModal(); // Открываем окно
            } catch (error) {
                console.error("Ошибка при получении данных:", error);
            }
        }

        async function toggleHabit(id) {
            try {
                // PATCH /habits/{habit_id}/toggle
                await fetch(API + "/" + id + "/toggle", {
                    method: "PATCH"
                });

                loadHabits();
            } catch (error) {
                console.error("Ошибка изменения статуса:", error);
            }
        }

        loadHabits();
    </script>
</body>

</html>
