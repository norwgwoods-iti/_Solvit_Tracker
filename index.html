<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трекер Привычек</title>
    <!-- Подключаем Tailwind CSS для красивого дизайна -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Подключаем FontAwesome для иконок -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#6366f1',
                    }
                }
            }
        }
    </script>
    <style>
        /* Плавные анимации */
        .habit-card {
            transition: all 0.3s ease;
        }
        .habit-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .completed-text {
            text-decoration: line-through;
            color: #9ca3af;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans text-gray-800">

    <div class="max-w-3xl mx-auto py-10 px-4 sm:px-6">
        <!-- Заголовок -->
        <header class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-gray-900 tracking-tight">
                <i class="fa-solid fa-leaf text-brand mr-2"></i> Мои Привычки
            </h1>
            <p class="text-gray-500 mt-2">Формируй себя каждый день</p>
        </header>

        <!-- Форма добавления/редактирования привычки -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-8">
            <h2 id="form-title" class="text-xl font-bold mb-4">Добавить новую привычку</h2>
            <form id="habit-form" class="space-y-4">
                <input type="hidden" id="habit-id">
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Название</label>
                    <input type="text" id="name" required placeholder="Например: Утренняя зарядка"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand focus:border-brand outline-none transition-colors">
                </div>
                <div>
                    <label for="description" class="block text-sm font-medium text-gray-700 mb-1">Описание (необязательно)</label>
                    <textarea id="description" rows="2" placeholder="Например: 15 минут йоги каждый день"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand focus:border-brand outline-none transition-colors"></textarea>
                </div>
                <div class="flex justify-end gap-3">
                    <button type="button" id="cancel-edit" class="hidden px-4 py-2 text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors font-medium">
                        Отмена
                    </button>
                    <button type="submit" id="submit-btn" class="px-6 py-2 bg-brand hover:bg-indigo-600 text-white rounded-lg transition-colors font-medium shadow-sm">
                        Добавить
                    </button>
                </div>
            </form>
        </div>

        <!-- Список привычек -->
        <div>
            <h2 class="text-xl font-bold mb-4 flex justify-between items-center">
                Список задач
                <button onclick="fetchHabits()" class="text-sm text-gray-500 hover:text-brand transition-colors" title="Обновить">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </h2>

            <div id="loading" class="text-center py-10 text-gray-400">
                <i class="fa-solid fa-spinner fa-spin text-3xl mb-2"></i>
                <p>Загрузка привычек...</p>
            </div>

            <div id="habits-list" class="space-y-4 hidden">
                <!-- Сюда будут динамически добавляться карточки привычек -->
            </div>

            <div id="empty-state" class="hidden text-center py-10 bg-white rounded-2xl border border-dashed border-gray-300">
                <div class="text-gray-300 mb-3"><i class="fa-solid fa-seedling text-5xl"></i></div>
                <h3 class="text-lg font-medium text-gray-900">Пока нет привычек</h3>
                <p class="text-gray-500 mt-1">Добавьте свою первую привычку выше!</p>
            </div>
        </div>
    </div>

    <script>
    const API_BASE_URL = 'http://localhost:8000/habits';
    let currentHabits = [];
    let isEditing = false;

    // Элементы DOM
    const form = document.getElementById('habit-form');
    const nameInput = document.getElementById('name');
    const descInput = document.getElementById('description');
    const idInput = document.getElementById('habit-id');
    const submitBtn = document.getElementById('submit-btn');
    const formTitle = document.getElementById('form-title');
    const cancelEditBtn = document.getElementById('cancel-edit');
    const habitsListContainer = document.getElementById('habits-list');
    const loadingIndicator = document.getElementById('loading');
    const emptyState = document.getElementById('empty-state');

    // Инициализация
    document.addEventListener('DOMContentLoaded', fetchHabits);

    // Обработка отправки формы
    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        // Формируем payload строго под Pydantic-схему
        const habitData = {
            name: nameInput.value.trim(),
            description: descInput.value.trim() || null,
            date_created_habit: new Date().toISOString().split('T')[0], // YYYY-MM-DD
            checking: false
        };

        if (isEditing) {
            const existingHabit = currentHabits.find(h => h.id == idInput.value);
            if (existingHabit) {
                habitData.checking = existingHabit.checking;
                habitData.date_created_habit = existingHabit.date_created_habit;
            }
            await updateHabit(idInput.value, habitData);
        } else {
            await createHabit(habitData);
        }
    });

    // Отмена редактирования
    cancelEditBtn.addEventListener('click', resetForm);

    // GET /habits
    async function fetchHabits() {
        showLoading(true);
        try {
            const response = await fetch(API_BASE_URL);
            if (!response.ok) throw new Error('Ошибка сети');
            const data = await response.json();
            currentHabits = data;
            renderHabits();
        } catch (error) {
            console.error('Ошибка при загрузке привычек:', error);
            currentHabits = [];
            renderHabits();
        } finally {
            showLoading(false);
        }
    }

    // POST /habits
    async function createHabit(habitData) {
        try {
            const response = await fetch(API_BASE_URL, {
                method: 'POST',
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(habitData) // Передаем корректную JSON-строку
            });

            if (response.ok) {
                resetForm();
                await fetchHabits();
            } else {
                const errDetail = await response.json();
                console.error('Ошибка ответа сервера:', errDetail);
            }
        } catch (error) {
            console.error('Ошибка отправки POST:', error);
        }
    }

    // PUT /habits/{id}
    async function updateHabit(id, habitData) {
        try {
            const response = await fetch(`${API_BASE_URL}/${id}`, {
                method: 'PUT',
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(habitData)
            });

            if (response.ok) {
                resetForm();
                await fetchHabits();
            } else {
                const errDetail = await response.json();
                console.error('Ошибка ответа сервера:', errDetail);
            }
        } catch (error) {
            console.error('Ошибка отправки PUT:', error);
        }
    }

    // DELETE /habits/{id}
    async function deleteHabit(id) {
        if (!confirm('Удалить эту привычку?')) return;

        try {
            const response = await fetch(`${API_BASE_URL}/${id}`, {
                method: 'DELETE'
            });
            if (response.ok) {
                await fetchHabits();
            }
        } catch (error) {
            console.error('Ошибка удаления:', error);
        }
    }

    // Переключение чека (checking)
    async function toggleCheck(id) {
        const habit = currentHabits.find(h => h.id === id);
        if (!habit) return;

        // Оптимистичное переключение локально
        habit.checking = !habit.checking;
        renderHabits();

        try {
            // Теперь фронтенд явно вызывает NEW эндпойнт!
            const response = await fetch(`${API_BASE_URL}/${id}/toggle`, {
                method: 'PATCH' // Тело запроса даже передавать не нужно!
            });

            if (!response.ok) throw new Error('Ошибка при смене статуса');
        } catch (error) {
            console.error('Ошибка изменения статуса:', error);
            habit.checking = !habit.checking; // Откат при ошибке
            renderHabits();
        }
    }

    function editHabit(id) {
        const habit = currentHabits.find(h => h.id === id);
        if (!habit) return;

        isEditing = true;
        idInput.value = habit.id;
        nameInput.value = habit.name;
        descInput.value = habit.description || '';

        formTitle.textContent = 'Редактировать привычку';
        submitBtn.textContent = 'Сохранить';
        cancelEditBtn.classList.remove('hidden');

        window.scrollTo({ top: 0, behavior: 'smooth' });
        nameInput.focus();
    }

    function resetForm() {
        form.reset();
        isEditing = false;
        idInput.value = '';
        formTitle.textContent = 'Добавить новую привычку';
        submitBtn.textContent = 'Добавить';
        cancelEditBtn.classList.add('hidden');
    }

    function formatDate(dateString) {
        if (!dateString) return '';
        const options = { day: 'numeric', month: 'short', year: 'numeric' };
        return new Date(dateString).toLocaleDateString('ru-RU', options);
    }

    function renderHabits() {
        habitsListContainer.innerHTML = '';

        if (currentHabits.length === 0) {
            habitsListContainer.classList.add('hidden');
            emptyState.classList.remove('hidden');
            return;
        }

        habitsListContainer.classList.remove('hidden');
        emptyState.classList.add('hidden');

        currentHabits.forEach(habit => {
            const isChecked = habit.checking;
            const card = document.createElement('div');
            card.className = `habit-card bg-white p-5 rounded-xl border ${isChecked ? 'border-green-200 bg-green-50/30' : 'border-gray-200'} flex items-start gap-4`;

            card.innerHTML = `
                <div class="mt-1">
                    <button onclick="toggleCheck(${habit.id})" class="flex items-center justify-center w-7 h-7 rounded-md border-2 transition-colors ${isChecked ? 'bg-green-500 border-green-500 text-white' : 'border-gray-300 text-transparent hover:border-green-400'}">
                        <i class="fa-solid fa-check text-sm"></i>
                    </button>
                </div>
                <div class="flex-1">
                    <h3 class="text-lg font-semibold ${isChecked ? 'completed-text' : 'text-gray-900'}">${escapeHTML(habit.name)}</h3>
                    ${habit.description ? `<p class="text-gray-600 text-sm mt-1 mb-2 ${isChecked ? 'completed-text' : ''}">${escapeHTML(habit.description)}</p>` : ''}
                    <div class="text-xs text-gray-400 mt-2 flex items-center">
                        <i class="fa-regular fa-calendar mr-1"></i> Создано: ${formatDate(habit.date_created_habit)}
                    </div>
                </div>
                <div class="flex flex-col gap-2 sm:flex-row ml-2">
                    <button onclick="editHabit(${habit.id})" class="p-2 text-gray-400 hover:text-blue-500 transition-colors bg-gray-50 hover:bg-blue-50 rounded-lg" title="Редактировать">
                        <i class="fa-solid fa-pen-to-square"></i>
                    </button>
                    <button onclick="deleteHabit(${habit.id})" class="p-2 text-gray-400 hover:text-red-500 transition-colors bg-gray-50 hover:bg-red-50 rounded-lg" title="Удалить">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </div>
            `;
            habitsListContainer.appendChild(card);
        });
    }

    function showLoading(show) {
        if (show) {
            loadingIndicator.classList.remove('hidden');
            habitsListContainer.classList.add('hidden');
            emptyState.classList.add('hidden');
        } else {
            loadingIndicator.classList.add('hidden');
        }
    }

    function escapeHTML(str) {
        if (!str) return '';
        return str.replace(/[&<>'"]/g,
            tag => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[tag] || tag)
        );
    }
    </script>
</body>
</html>
